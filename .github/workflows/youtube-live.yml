name: Basketball Game Continuous Test

on:
  workflow_dispatch:

jobs:
  run-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Run basketball game
        run: |
          echo "Starting Basketball Game..."
          
          google-chrome \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1920,1080 \
            --virtual-time-budget=15000 \
            https://soulfulmat1.github.io/youtube-live-game/

          echo "Basketball Game test completed."
