name: Basketball Game Long Running Test

on:
  workflow_dispatch:

jobs:
  run-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Run basketball game for 5 minutes
        run: |
          echo "Starting Basketball Game..."

          google-chrome \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --window-size=1920,1080 \
            --remote-debugging-port=9222 \
            https://soulfulmat1.github.io/youtube-live-game/ &

          CHROME_PID=$!

          echo "Chrome started. PID: $CHROME_PID"
          echo "Keeping basketball game running for 5 minutes..."

          sleep 300

          echo "5 minute test completed."

          kill $CHROME_PID || true
