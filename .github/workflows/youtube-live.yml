name: Basketball Game YouTube Live

on:
  workflow_dispatch:

jobs:
  youtube-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install streaming tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio
          ffmpeg -version
          google-chrome --version

      - name: Start virtual display and game
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          
          pulseaudio --start
          sleep 2
          
          pactl load-module module-null-sink sink_name=GameAudio sink_properties=device.description=GameAudio
          pactl set-default-sink GameAudio
          
          echo "Virtual game audio device started."
          sleep 3

          DISPLAY=:99 google-chrome \
            --no-sandbox \
            --no-first-run \
            --disable-dev-shm-usage \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-position=0,0 \
            --window-size=1920,1080 \
                        --kiosk \
            https://soulfulmat1.github.io/youtube-live-game/ &

          sleep 15
          echo "Game browser is running."

          ffmpeg \
            -f x11grab \
            -framerate 30 \
            -video_size 1920x1080 \
            -i :99.0 \
            -f pulse \
            -i GameAudio.monitor \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -b:v 6800k \
            -maxrate 6800k \
            -bufsize 13600k \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${{ secrets.YOUTUBE_STREAM_KEY }}"
